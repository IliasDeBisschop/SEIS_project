server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;

    # Schakel logging uit voor de afbeelding
    location /image/localization_visualization.png {
        access_log off;
        log_not_found off;
    }

    # Standaard locatie
    location / {
        try_files $uri $uri/ =404;
    }
}