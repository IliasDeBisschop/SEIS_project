<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <h1>Welkom bij de Web App</h1>
    <h1>Robot Task Tracker</h1>
    <button onclick="sendCommandToRobot()">robot stopen/starten</button>
    <button onclick="window.location.href='tasks.html'">Bekijk Taken</button>
    <table>
        <thead>
            <tr>
                <th>Robot ID</th>
                <th>Current Task</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="taskTable">
            <!-- Rows will be dynamically populated -->
        </tbody>
    </table>
    <img id="mapImage" src="./img/map_with_bots.png" alt="Map with Bots" style="border: 2px solid #000; border-radius: 5px; width: 600px; ">
</body>

<script>
    const botEndpoints = ["bot1", "bot2", "bot3"];
    const apiBaseUrl = "http://localhost:5000";
    const imageElement = document.querySelector("img");
    
    async function fetchBotTasks() {
        const tableBody = document.getElementById("taskTable");
        tableBody.innerHTML = ""; // Clear existing rows

        for (const botId of botEndpoints) {
            try {
                const response = await fetch(`${apiBaseUrl}/bot/${botId}/get_bot_task`); // Updated endpoint
                if (!response.ok) {
                    throw new Error("Bot not reachable");
                }
                const data = await response.json();

                const row = document.createElement("tr");
                let task, status;

                if (data.error) {
                    task = "No task assigned";
                    status = "Waiting";
                } else {
                    if (data.bot_status) {
                        row.style.backgroundColor = "red";
                        status = "blocked";
                    }
                    else{
                        status = "Active";
                    }
                    // Format task as a tuple (row, column)
                    task = `(${data.task.row}, ${data.task.column})`;
                }

                row.innerHTML = `
                    <td>${botId}</td>
                    <td>${task}</td>
                    <td>${status}</td>
                    <td><button onclick="stopRobot('${botId}')">Stop</button></td>
                `;
                tableBody.appendChild(row);
            } catch (error) {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${botId}</td>
                    <td>No task</td>
                    <td>No connection</td>
                    <td><button onclick="stopRobot('${botId}')">Stop</button></td>
                `;
                tableBody.appendChild(row);
            }
        }
    }
    function reloadImage() {
        fetch(`${apiBaseUrl}/vizualizeBots`)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to fetch visualization");
                }
                return response.blob();
            })
            .then(() => {
                const timestamp = new Date().getTime(); // Unieke timestamp
                imageElement.src = `./img/map_with_bots.png?${timestamp}`;
            })
            .catch(error => {
                console.error("Error reloading image:", error);
            });
    }

    // Fetch tasks every 5 seconds
    setInterval(fetchBotTasks, 5000);
    setInterval(reloadImage, 1000);
    fetchBotTasks();
    reloadImage(); 
    function sendCommandToRobot() {
        console.log("Sending command to robot...");
        for (const botId of botEndpoints) {
            fetch(`${apiBaseUrl}/bot/${botId}/control`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Failed to send command to ${botId}`);
                }
                console.log(`Command sent to ${botId} successfully.`);
            })
            .catch(error => {
                console.error(`Error sending command to ${botId}:`, error);
            });
        }
    }
    function stopRobot(botId) {
        fetch(`${apiBaseUrl}/bot/${botId}/control`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Failed to send command to ${botId}`);
                }
                console.log(`Command sent to ${botId} successfully.`);
            })
            .catch(error => {
                console.error(`Error sending command to ${botId}:`, error);
            });
    }
</script>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
    }
    th {
        background-color: #f4f4f4;
    }
    img {
        border: 2px solid #000; /* Zwarte border van 2px */
        border-radius: 5px; /* Optioneel: afgeronde hoeken */
    }
</style>
</html>
