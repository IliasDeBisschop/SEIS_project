<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Task Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <h1>Robot Task Tracker</h1>
    <table>
        <thead>
            <tr>
                <th>Robot ID</th>
                <th>Current Task</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="taskTable">
            <!-- Rows will be dynamically populated -->
        </tbody>
    </table>

    <script>
        const botEndpoints = ["bot1", "bot2", "bot3"];
        const apiBaseUrl = "http://localhost:5000";

        async function fetchBotTasks() {
            const tableBody = document.getElementById("taskTable");
            tableBody.innerHTML = ""; // Clear existing rows

            for (const botId of botEndpoints) {
                try {
                    const response = await fetch(`${apiBaseUrl}/bot/${botId}/get_task`);
                    if (!response.ok) {
                        throw new Error("Bot not reachable");
                    }
                    const data = await response.json();

                    const row = document.createElement("tr");
                    let task, status;

                    if (data.error) {
                        task = "No task assigned";
                        status = "Waiting";
                    } else {
                        task = `X: ${data.task.x}, Y: ${data.task.y}`;
                        status = "Active";
                    }

                    row.innerHTML = `
                        <td>${botId}</td>
                        <td>${task}</td>
                        <td>${status}</td>
                    `;
                    tableBody.appendChild(row);
                } catch (error) {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${botId}</td>
                        <td>No task</td>
                        <td>No connection</td>
                    `;
                    tableBody.appendChild(row);
                }
            }
        }

        // Fetch tasks every 5 seconds
        setInterval(fetchBotTasks, 5000);
        fetchBotTasks();
    </script>
</body>
</html>
