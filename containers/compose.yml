services:
  bot1:
    build:
      context: ./bot
      dockerfile: dockerfile
    stdin_open: true
    tty: true
    ports:
      - "5001:5001"  # Expose port 5000 in the container as 5001 on the host
      - "5002:5002"  # Expose port 5002 in the container as 5002 on the host
    container_name: bot1

  bot2:
    build:
      context: ./bot
      dockerfile: dockerfile
    stdin_open: true
    tty: true
    ports:
      - "5003:5001"  # Expose port 5000 in the container as 5001 on the host
      - "5004:5002"  # Expose port 5002 in the container as 5002 on the host
    container_name: bot2

  bot3:
    build:
      context: ./bot
      dockerfile: dockerfile
    stdin_open: true
    tty: true
    ports:
      - "5005:5001"  # Expose port 5000 in the container as 5001 on the host
      - "5006:5002"  # Expose port 5002 in the container as 5002 on the host
    container_name: bot3

  server:
    build:
      context: ./server
      dockerfile: dockerfile
    stdin_open: true
    tty: true
    ports:
      - "5000:5000"  # Expose port 5000 for the server
    depends_on:
      - bot1
      - bot2
      - bot3
    container_name: server
    volumes:
      - ./server/img:/app/img  # Voeg map.png toe aan de server container

  webapp:
    image: nginx:latest
    container_name: webapp
    ports:
      - "8080:80"  # Expose port 80 in the container as 8080 on the host
    volumes:
      - ./server/img:/usr/share/nginx/html/img  # Mount the img directory to the nginx html/img directory
      - ./webapp:/usr/share/nginx/html  # Mount the webapp directory to the nginx html directory
      - ./webApp/nginx.conf:/etc/nginx/conf.d/default.conf # Mount the nginx.conf file to the nginx configuration directory
    depends_on:
      - server
volumes:
  bot1_output:

